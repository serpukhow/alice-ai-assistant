name: One-time Beget provider connectivity check

on:
  push:
    paths:
      - .github/workflows/beget-provider-check-once.yml

permissions:
  contents: read

jobs:
  provider-check:
    if: startsWith(github.event.head_commit.message, 'ONE_TIME_BEGET_PROVIDER_CHECK')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified Beget SSH access
        shell: bash
        env:
          BEGET_SSH_HOST: ${{ vars.BEGET_SSH_HOST }}
          BEGET_SSH_USER: ${{ vars.BEGET_SSH_USER }}
          BEGET_SSH_PORT: ${{ vars.BEGET_SSH_PORT || '22' }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
          BEGET_KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$BEGET_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$BEGET_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/id_ed25519"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            echo "BEGET_SSH_HOST=$BEGET_SSH_HOST"
            echo "BEGET_SSH_USER=$BEGET_SSH_USER"
            echo "BEGET_SSH_PORT=$BEGET_SSH_PORT"
          } >> "$GITHUB_ENV"

      - name: Check Cloudflare reachability and Supabase credentials safely
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SCRIPT_B64="$(base64 -w0 <<'BEGET_PROVIDER_CHECK'
          set +x
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME/alice-ai-assistant"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const envText = fs.readFileSync(".env", "utf8");
          function value(name) {
            const match = envText.match(new RegExp("^\\s*" + name + "\\s*=\\s*(.*?)\\s*$", "m"));
            let v = match?.[1] || "";
            if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v = v.slice(1,-1);
            return v;
          }
          const supabaseUrl = value("SUPABASE_URL").replace(/\\/+$/, "");
          const supabaseKey = value("SUPABASE_SECRET_KEY");
          console.log("=== SUPABASE REST CONNECTIVITY ===");
          if (!supabaseUrl || !supabaseKey) {
            console.log("Supabase settings missing");
          } else {
            try {
              const r = await fetch(supabaseUrl + "/rest/v1/alice_memories?select=id&limit=1", {
                headers: { apikey: supabaseKey, "Content-Type": "application/json" },
                signal: AbortSignal.timeout(10000)
              });
              const text = await r.text();
              console.log("Supabase HTTP:", r.status);
              if (r.ok) console.log("Supabase table query: OK; response length =", text.length);
              else {
                try {
                  const j = JSON.parse(text);
                  console.log("Supabase error code:", j.code || "not supplied");
                  console.log("Supabase error message:", String(j.message || j.msg || "No message").slice(0,500));
                } catch { console.log("Supabase returned a non-JSON error body"); }
              }
            } catch (e) {
              console.log("Supabase network error:", e?.name || "Error", String(e?.message || "").slice(0,300));
            }
          }
          console.log("=== CLOUDFLARE API REACHABILITY (NO AUTH) ===");
          try {
            const r = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {
              signal: AbortSignal.timeout(10000)
            });
            console.log("Cloudflare API HTTP:", r.status);
            const text = await r.text();
            try {
              const j = JSON.parse(text);
              console.log("Cloudflare API error code:", j.errors?.[0]?.code ?? "none");
              console.log("Cloudflare API message:", String(j.errors?.[0]?.message || "none").slice(0,300));
            } catch { console.log("Cloudflare response is not JSON"); }
          } catch (e) {
            console.log("Cloudflare network error:", e?.name || "Error", String(e?.message || "").slice(0,300));
          }
          NODE
          BEGET_PROVIDER_CHECK
          )"
          ssh -A -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$BEGET_SSH_PORT" "$BEGET_SSH_USER@$BEGET_SSH_HOST" \
            "printf '%s' '$REMOTE_SCRIPT_B64' | ssh -A -o BatchMode=yes -o StrictHostKeyChecking=accept-new -p 222 localhost 'base64 -d | bash'"
