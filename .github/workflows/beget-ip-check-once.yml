name: One-time Beget IPv4 IPv6 Gemini check

on:
  push:
    paths:
      - .github/workflows/beget-ip-check-once.yml

permissions:
  contents: read

jobs:
  ip-check:
    if: startsWith(github.event.head_commit.message, 'ONE_TIME_BEGET_IP_CHECK')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure verified Beget SSH access
        shell: bash
        env:
          BEGET_SSH_HOST: ${{ vars.BEGET_SSH_HOST }}
          BEGET_SSH_USER: ${{ vars.BEGET_SSH_USER }}
          BEGET_SSH_PORT: ${{ vars.BEGET_SSH_PORT || '22' }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
          BEGET_KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$BEGET_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$BEGET_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/id_ed25519"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            echo "BEGET_SSH_HOST=$BEGET_SSH_HOST"
            echo "BEGET_SSH_USER=$BEGET_SSH_USER"
            echo "BEGET_SSH_PORT=$BEGET_SSH_PORT"
          } >> "$GITHUB_ENV"

      - name: Compare Gemini access over IPv4 and IPv6
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SCRIPT_B64="$(base64 -w0 <<'BEGET_IP_CHECK'
          set +x
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME/alice-ai-assistant"
          echo "=== PUBLIC EGRESS IP GEOLOOKUP ==="
          for family in 4 6; do
            echo "--- IPv$family ---"
            curl -"$family" -sS --max-time 8 https://ipinfo.io/json 2>&1 | head -c 700 || true
            echo
          done

          echo "=== DNS ANSWERS FOR GOOGLE API ==="
          node --input-type=module -e '
            import dns from "node:dns";
            const list = await dns.promises.lookup("generativelanguage.googleapis.com", {all:true}).catch(e => []);
            console.log(list.map(x => x.address + " IPv" + x.family).join("\n") || "no DNS answers");
            console.log("Node DNS order:", dns.getDefaultResultOrder());
          '

          echo "=== GEMINI API REQUEST VIA IPv4 AND IPv6 ==="
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { spawnSync } from "node:child_process";
          const envText = fs.readFileSync(".env", "utf8");
          const match = envText.match(/^\s*GEMINI_API_KEY\s*=\s*(.*?)\s*$/m);
          let apiKey = match?.[1] || "";
          if ((apiKey.startsWith('"') && apiKey.endsWith('"')) || (apiKey.startsWith("'") && apiKey.endsWith("'"))) apiKey = apiKey.slice(1, -1);
          if (!apiKey) { console.log("GEMINI_API_KEY empty"); process.exit(0); }
          const body = JSON.stringify({contents:[{role:"user",parts:[{text:"Reply only OK"}]}],generationConfig:{maxOutputTokens:10}});
          for (const family of ["-4","-6"]) {
            const result = spawnSync("curl", [
              family, "-sS", "--max-time", "12",
              "-o", "/tmp/gemini-ip-check-body.json",
              "-w", "%{http_code}",
              "-X", "POST",
              "-H", "Content-Type: application/json",
              "-H", "x-goog-api-key: " + apiKey,
              "--data-binary", body,
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent"
            ], {encoding:"utf8"});
            const status = (result.stdout || "").trim();
            console.log(family === "-4" ? "IPv4 HTTP:" : "IPv6 HTTP:", status || "no response");
            if (result.error) console.log("curl process error:", result.error.message);
            if (result.stderr) console.log("curl transport:", result.stderr.slice(0,300));
            try {
              const response = JSON.parse(fs.readFileSync("/tmp/gemini-ip-check-body.json","utf8"));
              if (response.error) {
                console.log("Google status:", response.error.status || "unknown");
                console.log("Google message:", String(response.error.message || "").slice(0,500));
              } else {
                console.log("Gemini reply:", response.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("") || "empty");
              }
            } catch {}
          }
          NODE
          BEGET_IP_CHECK
          )"
          ssh -A -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$BEGET_SSH_PORT" "$BEGET_SSH_USER@$BEGET_SSH_HOST" \
            "printf '%s' '$REMOTE_SCRIPT_B64' | ssh -A -o BatchMode=yes -o StrictHostKeyChecking=accept-new -p 222 localhost 'base64 -d | bash'"
