name: One-time Beget application upload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/beget-upload-once.yml

permissions:
  contents: read

jobs:
  upload:
    if: startsWith(github.event.head_commit.message, 'ONE_TIME_BEGET_UPLOAD')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/conversation-context
          persist-credentials: false

      - name: Validate configuration and install SSH key
        shell: bash
        env:
          BEGET_SSH_HOST: ${{ vars.BEGET_SSH_HOST }}
          BEGET_SSH_USER: ${{ vars.BEGET_SSH_USER }}
          BEGET_SSH_PORT: ${{ vars.BEGET_SSH_PORT || '22' }}
          BEGET_APP_DIR: ${{ vars.BEGET_APP_DIR || 'alice-ai-assistant' }}
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
          BEGET_KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$BEGET_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::Invalid BEGET_SSH_HOST"; exit 1; }
          [[ "$BEGET_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid BEGET_SSH_USER"; exit 1; }
          [[ "$BEGET_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Invalid BEGET_SSH_PORT"; exit 1; }
          [[ "$BEGET_APP_DIR" =~ ^[A-Za-z0-9._/-]+$ && "$BEGET_APP_DIR" != /* && "$BEGET_APP_DIR" != *..* ]] || { echo "::error::Invalid BEGET_APP_DIR"; exit 1; }
          [[ -n "$BEGET_SSH_PRIVATE_KEY" ]] || { echo "::error::Missing BEGET_SSH_PRIVATE_KEY"; exit 1; }
          [[ -n "$BEGET_KNOWN_HOSTS" ]] || { echo "::error::Missing BEGET_KNOWN_HOSTS"; exit 1; }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\\n' "$BEGET_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\\n' "$BEGET_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/id_ed25519"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
            echo "BEGET_SSH_HOST=$BEGET_SSH_HOST"
            echo "BEGET_SSH_USER=$BEGET_SSH_USER"
            echo "BEGET_SSH_PORT=$BEGET_SSH_PORT"
            echo "BEGET_APP_DIR=$BEGET_APP_DIR"
          } >> "$GITHUB_ENV"

      - name: Validate application JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check api/alice.js
          node --version

      - name: Upload application files outside public_html
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/alice-ai-assistant.tar.gz"
          tar -czf "$ARCHIVE" \\
            --exclude='.env' \\
            --exclude='.env.*' \\
            --exclude='node_modules' \\
            --exclude='tmp' \\
            -C "$GITHUB_WORKSPACE" \\
            server.js package.json api/alice.js .env.example .gitignore

          printf -v REMOTE_CMD \\
            'set -e; mkdir -p "$HOME/%s"; tar -xzf - -C "$HOME/%s"; mkdir -p "$HOME/%s/tmp"; test -s "$HOME/%s/server.js"; test -s "$HOME/%s/package.json"; test -s "$HOME/%s/api/alice.js"; printf "Upload verified: %%s\\n" "$HOME/%s"; ls -l "$HOME/%s" "$HOME/%s/api"' \\
            "$BEGET_APP_DIR" "$BEGET_APP_DIR" "$BEGET_APP_DIR" "$BEGET_APP_DIR" "$BEGET_APP_DIR" "$BEGET_APP_DIR" "$BEGET_APP_DIR" "$BEGET_APP_DIR" "$BEGET_APP_DIR"

          cat "$ARCHIVE" | ssh -A -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \\
            -i "$HOME/.ssh/id_ed25519" -p "$BEGET_SSH_PORT" \\
            "$BEGET_SSH_USER@$BEGET_SSH_HOST" "$REMOTE_CMD"

          echo "Application files uploaded. No .env file was sent; public_html was not touched."
